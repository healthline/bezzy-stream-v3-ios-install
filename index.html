<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bezzy Installs</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #0077b6;
        --accent-strong: #00649b;
        --android: #1b7f4c;
        --bg: #f7f9fb;
        --card: #ffffff;
        --muted: #5f6b7a;
        --text: #15202b;
        --border: #d8e0e8;
        --soft: #eef4f8;
        --danger: #b45309;
        --danger-strong: #92400e;
        --danger-border: #f59e0b;
        --danger-soft: #fff7ed;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1117;
          --card: #151b23;
          --muted: #9aa7b5;
          --text: #f2f5f8;
          --border: #303946;
          --soft: #1d2631;
          --danger: #fbbf24;
          --danger-strong: #f59e0b;
          --danger-border: #b45309;
          --danger-soft: #2a2012;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        line-height: 1.45;
      }

      main {
        width: min(100%, 920px);
        margin: 0 auto;
        padding: 32px 16px;
        display: grid;
        gap: 24px;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        padding: 24px;
      }

      .page-header {
        text-align: center;
        padding: 0 8px;
      }

      .page-header h1 {
        margin: 0 0 6px;
        font-size: clamp(1.6rem, 5vw, 2rem);
      }

      .page-header p {
        margin: 0;
        color: var(--muted);
      }

      .lane-toggle {
        display: flex;
        margin: 16px auto 0;
        max-width: 420px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--soft);
      }

      .lane-btn {
        flex: 1 1 0;
        min-height: 44px;
        padding: 4px 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.15;
        cursor: pointer;
      }

      .lane-btn.is-active {
        background: var(--accent);
        color: #fff;
      }

      .lane-note {
        margin: 10px 0 0;
        min-height: 1.2em;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .lane-btn[data-lane="prod"].is-active,
      .lane-btn[data-lane="v2prod"].is-active {
        background: var(--danger-strong);
      }

      .lane-note.is-prod {
        color: var(--danger);
        font-weight: 600;
      }

      .panel.lane-prod,
      .panel.lane-v2prod {
        border-color: var(--danger-border);
        border-left-width: 5px;
      }

      .env-badge {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--soft);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .panel.lane-prod .env-badge,
      .panel.lane-v2prod .env-badge {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: var(--danger-border);
      }

      .build-summary strong.lane-prod-env {
        color: var(--danger);
      }

      .filter {
        width: 100%;
        margin-top: 14px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
      }

      .app-header {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .app-icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        flex: 0 0 auto;
      }

      h1 {
        margin: 0 0 4px;
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        letter-spacing: 0;
      }

      h2 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0;
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .build-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-top: 22px;
        padding: 18px 0 0;
        border-top: 1px solid var(--border);
      }

      .build-detail {
        display: grid;
        gap: 2px;
      }

      .label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .build-detail strong,
      .build-detail time {
        color: var(--text);
        font-size: 1rem;
        font-weight: 700;
      }

      .platform-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .platform-card {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--soft);
        padding: 18px;
      }

      .platform-card.is-recommended {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }

      .platform-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .platform-title {
        display: grid;
        gap: 3px;
      }

      .platform-pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .recommended-label {
        display: none;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .platform-card.is-recommended .recommended-label {
        display: block;
      }

      .platform-meta {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .platform-meta p {
        margin: 0;
      }

      .install {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        width: 100%;
        padding: 0 18px;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-size: 1.04rem;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }

      .install:hover {
        background: var(--accent-strong);
      }

      .install.android {
        background: var(--android);
      }

      .secondary-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .secondary {
        flex: 1 1 150px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }

      .instructions {
        border-top: 1px solid var(--border);
        padding-top: 14px;
      }

      .instructions summary {
        cursor: pointer;
        color: var(--text);
        font-weight: 700;
      }

      .instructions summary::marker {
        color: var(--accent);
      }

      .steps {
        margin: 14px 0 0;
        padding-left: 20px;
      }

      .steps li + li {
        margin-top: 9px;
      }

      .instruction-notes {
        margin-top: 14px;
        color: var(--muted);
      }

      .instruction-notes p {
        margin: 0;
      }

      .instruction-notes p + p {
        margin-top: 8px;
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .panel[hidden] {
        display: none;
      }

      @media (max-width: 720px) {
        main {
          padding: 18px 12px;
        }

        .panel {
          padding: 20px;
        }

        .platform-grid {
          grid-template-columns: 1fr;
        }

        .app-icon {
          width: 64px;
          height: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1 id="page-title">Bezzy Installs</h1>
        <p id="page-subtitle">Builds for authorized internal testing.</p>
        <div class="lane-toggle" role="tablist" aria-label="Build version">
          <button type="button" class="lane-btn" role="tab" data-lane="v3" aria-selected="false">v3 (stage)</button>
          <button type="button" class="lane-btn is-active" role="tab" data-lane="prod" aria-selected="true">v3 (prod)</button>
          <button type="button" class="lane-btn" role="tab" data-lane="v2" aria-selected="false">v2 (stage)</button>
          <button type="button" class="lane-btn" role="tab" data-lane="v2prod" aria-selected="false">v2 (prod)</button>
          <button type="button" class="lane-btn" role="tab" data-lane="search" aria-selected="false">Search (Preview)</button>
        </div>
        <p id="lane-note" class="lane-note"></p>
        <input
          id="app-filter"
          class="filter"
          type="search"
          placeholder="Filter apps (e.g. migraine, psoriasis)…"
          aria-label="Filter apps"
        />
      </header>

      <div id="app-list"></div>
    </main>

    <script>
      // Single build timestamp for this rollout.
      const BUILD_UPDATED_AT = "2026-06-10T22:47:35Z";

      // All 10 Bezzy stage apps. scheme:null when the app has no usable
      // custom URL scheme (copd's Info.plist carries a wrong scheme; msbuddy
      // has none) — those omit the "Open app" convenience link.
      //
      // Each app carries two build "lanes": v3 (the new Stream-migration build)
      // and v2 (the current production build, pre-migration). A lane is null
      // when that build hasn't been published yet. Both lanes share the same
      // bundle id, so only one can be installed on a device at a time.
      const APPS = [
        { id: "dep",     name: "Bezzy Depression",                bundleId: "com.healthline.dep-stage",  icon: "display-image.png",         scheme: "dephealthline",
          v3: { version: "15.1.1", manifest: "manifest.plist",         apk: "dep-stage.apk" },
          v2: { version: "14.6.1", manifest: "dep-v2-manifest.plist", apk: "dep-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "dep-prod-manifest.plist", apk: "dep-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "dep-v2-prod-manifest.plist", apk: "dep-v2-prod-stage.apk" },
          search: { version: "15.1.1", manifest: "dep-search-preview-manifest.plist", apk: "dep-stage-search-spike.apk" } },
        { id: "pso",     name: "Bezzy Psoriasis",                 bundleId: "com.healthline.pso-stage",  icon: "pso-display-image.png",     scheme: "psohealthline",
          v3: { version: "15.1.1", manifest: "pso-manifest.plist",     apk: "pso-stage.apk" }, v2: { version: "14.6.1", manifest: "pso-v2-manifest.plist", apk: "pso-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "pso-prod-manifest.plist", apk: "pso-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "pso-v2-prod-manifest.plist", apk: "pso-v2-prod-stage.apk" } },
        { id: "bcbuddy", name: "Bezzy Breast Cancer",             bundleId: "com.healthline.bc-stage",   icon: "bcbuddy-display-image.png", scheme: "bchealthline",
          v3: { version: "15.1.1", manifest: "bcbuddy-manifest.plist", apk: "bcbuddy-stage.apk" }, v2: { version: "14.6.1", manifest: "bcbuddy-v2-manifest.plist", apk: "bcbuddy-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "bcbuddy-prod-manifest.plist", apk: "bcbuddy-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "bcbuddy-v2-prod-manifest.plist", apk: "bcbuddy-v2-prod-stage.apk" } },
        { id: "copd",    name: "Bezzy COPD",                      bundleId: "com.healthline.copd-stage", icon: "copd-display-image.png",    scheme: null,
          v3: { version: "15.1.1",    manifest: "copd-manifest.plist",    apk: "copd-stage.apk" }, v2: { version: "14.6.1", manifest: "copd-v2-manifest.plist", apk: "copd-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "copd-prod-manifest.plist", apk: "copd-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "copd-v2-prod-manifest.plist", apk: "copd-v2-prod-stage.apk" } },
        { id: "ibd",     name: "Bezzy IBD (Crohn's & Colitis)",   bundleId: "com.healthline.ibd-stage",  icon: "ibd-display-image.png",     scheme: "ibdhealthline",
          v3: { version: "15.1.1", manifest: "ibd-manifest.plist",     apk: "ibd-stage.apk" }, v2: { version: "14.6.1", manifest: "ibd-v2-manifest.plist", apk: "ibd-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "ibd-prod-manifest.plist", apk: "ibd-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "ibd-v2-prod-manifest.plist", apk: "ibd-v2-prod-stage.apk" } },
        { id: "mig",     name: "Bezzy Migraine",                  bundleId: "com.healthline.mig-stage",  icon: "mig-display-image.png",     scheme: "mighealthline",
          v3: { version: "15.1.1", manifest: "mig-manifest.plist",     apk: "mig-stage.apk" }, v2: { version: "14.6.1", manifest: "mig-v2-manifest.plist", apk: "mig-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "mig-prod-manifest.plist", apk: "mig-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "mig-v2-prod-manifest.plist", apk: "mig-v2-prod-stage.apk" } },
        { id: "msbuddy", name: "Bezzy MS: Multiple Sclerosis",    bundleId: "com.healthline.ms-stage",   icon: "msbuddy-display-image.png", scheme: null,
          v3: { version: "15.1.1", manifest: "msbuddy-manifest.plist", apk: "msbuddy-stage.apk" }, v2: { version: "14.6.1", manifest: "msbuddy-v2-manifest.plist", apk: "msbuddy-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "msbuddy-prod-manifest.plist", apk: "msbuddy-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "msbuddy-v2-prod-manifest.plist", apk: "msbuddy-v2-prod-stage.apk" } },
        { id: "psa",     name: "Bezzy Psoriatic Arthritis",       bundleId: "com.healthline.psa-stage",  icon: "psa-display-image.png",     scheme: "psahealthline",
          v3: { version: "15.1.1", manifest: "psa-manifest.plist",     apk: "psa-stage.apk" }, v2: { version: "14.6.1", manifest: "psa-v2-manifest.plist", apk: "psa-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "psa-prod-manifest.plist", apk: "psa-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "psa-v2-prod-manifest.plist", apk: "psa-v2-prod-stage.apk" } },
        { id: "ra",      name: "Bezzy RA: Rheumatoid Arthritis",  bundleId: "com.healthline.ra-stage",   icon: "ra-display-image.png",      scheme: "rahealthline",
          v3: { version: "15.1.1", manifest: "ra-manifest.plist",      apk: "ra-stage.apk" }, v2: { version: "14.6.1", manifest: "ra-v2-manifest.plist", apk: "ra-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "ra-prod-manifest.plist", apk: "ra-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "ra-v2-prod-manifest.plist", apk: "ra-v2-prod-stage.apk" } },
        { id: "t2d",     name: "Bezzy Type 2 Diabetes",           bundleId: "com.healthline.t2d-stage",  icon: "t2d-display-image.png",     scheme: "t2dhealthline",
          v3: { version: "15.1.1", manifest: "t2d-manifest.plist",     apk: "t2d-stage.apk" }, v2: { version: "14.6.1", manifest: "t2d-v2-manifest.plist", apk: "t2d-v2-stage.apk" },
          prod: { version: "15.1.1", manifest: "t2d-prod-manifest.plist", apk: "t2d-prod-stage.apk" }, v2prod: { version: "14.6.1", manifest: "t2d-v2-prod-manifest.plist", apk: "t2d-v2-prod-stage.apk" } },
      ];

      // Active build lane; flipped by the lane toggle. Defaults to the v3
      // production lane — this page is primarily for guides installing the
      // v3 prod build to test against the live production backend.
      let CURRENT_LANE = "prod";

      const BASE = "https://bezzy-stream-v3-app-install.netlify.app";

      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function appPanel(app, lane) {
        const b = app[lane];
        const name = esc(app.name);
        const meta = LANE_META[lane];
        const laneUpdated = (meta && meta.updated) || BUILD_UPDATED_AT;
        const openLink = app.scheme
          ? `<div class="secondary-actions">
               <a class="install secondary" href="${app.scheme}://">Open iOS app</a>
             </div>`
          : "";
        return `
        <section class="panel lane-${lane}" data-app="${app.id}" data-name="${esc(app.name.toLowerCase())} ${app.id}">
          <div class="app-header">
            <img class="app-icon" src="./${app.icon}" alt="" />
            <div>
              <h1>${name}</h1>
              <p class="meta">${esc(meta.build)}</p>
              <p class="meta"><code>${esc(app.bundleId)}</code></p>
              <span class="env-badge">${esc(meta.env)}</span>
            </div>
          </div>

          <div class="build-summary" aria-label="Build details">
            <div class="build-detail">
              <span class="label">Environment</span>
              <strong class="${(lane === "prod" || lane === "v2prod") ? "lane-prod-env" : ""}">${esc(meta.env)}</strong>
            </div>
            <div class="build-detail">
              <span class="label">Version</span>
              <strong>${esc(b.version)}</strong>
            </div>
          </div>

          <div class="platform-grid" aria-label="Choose a platform">
            ${b.manifest ? `<article class="platform-card" data-platform-card="ios">
              <div class="platform-heading">
                <div class="platform-title">
                  <span class="label">iPhone and iPad</span>
                  <h2>Install iOS app</h2>
                  <span class="recommended-label">Recommended for this device</span>
                </div>
                <span class="platform-pill">iOS</span>
              </div>
              <div class="platform-meta">
                <p><strong>Version:</strong> ${esc(b.version)}</p>
                <p><strong>Last update:</strong>
                  <time data-last-updated-at="${laneUpdated}">${laneUpdated}</time>
                </p>
              </div>
              <a class="install" href="itms-services://?action=download-manifest&url=${BASE}/${b.manifest}">Install on iOS</a>
              ${openLink}
              <details class="instructions">
                <summary>iOS installation instructions</summary>
                <ol class="steps">
                  <li>Open this page in Safari on an iPhone or iPad.</li>
                  <li>Tap Install on iOS and confirm the install prompt.</li>
                  <li>After it installs, open ${name} from the Home Screen.</li>
                  <li>If iOS says the enterprise developer is untrusted, open Settings.</li>
                  <li>Go to General, then VPN &amp; Device Management.</li>
                  <li>Under Enterprise App, tap Healthline Networks, Inc.</li>
                  <li>Tap Trust Healthline Networks, Inc., then return to ${name}.</li>
                </ol>
                <div class="instruction-notes">
                  <p>The trust step is only needed the first time this enterprise developer is used on a device, and covers every Bezzy app on it.</p>
                  <p>iOS does not allow an OTA-installed app to open automatically.</p>
                </div>
              </details>
            </article>` : ""}

            <article class="platform-card" data-platform-card="android">
              <div class="platform-heading">
                <div class="platform-title">
                  <span class="label">Android phone</span>
                  <h2>Download Android app</h2>
                  <span class="recommended-label">Recommended for this device</span>
                </div>
                <span class="platform-pill">Android</span>
              </div>
              <div class="platform-meta">
                <p><strong>Build:</strong> Android APK</p>
                <p><strong>Last update:</strong>
                  <time data-last-updated-at="${laneUpdated}">${laneUpdated}</time>
                </p>
              </div>
              <a class="install android" href="./${b.apk}" download>Download Android APK</a>
              <details class="instructions">
                <summary>Android installation instructions</summary>
                <ol class="steps">
                  <li>Open this page in Chrome on an Android device.</li>
                  <li>Tap Download Android APK.</li>
                  <li>Open the downloaded file when Chrome finishes.</li>
                  <li>If Android blocks the install, allow this browser to install unknown apps.</li>
                  <li>Finish the install, then open ${name} from the app launcher.</li>
                </ol>
                <div class="instruction-notes">
                  <p>Android may ask for install permission the first time a browser installs an APK.</p>
                  <p>This build is for authorized internal testing only.</p>
                </div>
              </details>
            </article>
          </div>
        </section>`;
      }

      const numberWords = {
        1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six",
        7: "seven", 8: "eight", 9: "nine", 10: "ten", 11: "eleven", 12: "twelve",
      };
      const countLabel = (v) => numberWords[v] || String(v);

      function isYesterday(date, now) {
        const y = new Date(now);
        y.setDate(now.getDate() - 1);
        return date.toDateString() === y.toDateString();
      }

      function formatLastUpdated(date, now = new Date()) {
        const elapsed = Math.max(0, now.getTime() - date.getTime());
        const min = 60 * 1000, hr = 60 * min;
        if (elapsed < 45 * 1000) return "just now";
        if (elapsed < 90 * 1000) return "one minute ago";
        if (elapsed < hr) return `${countLabel(Math.round(elapsed / min))} minutes ago`;
        if (elapsed < 90 * min) return "one hour ago";
        if (elapsed < 24 * hr) return `${countLabel(Math.round(elapsed / hr))} hours ago`;
        if (isYesterday(date, now)) return "yesterday";
        return date.toLocaleDateString(undefined, {
          month: "short", day: "numeric",
          year: date.getFullYear() === now.getFullYear() ? undefined : "numeric",
        });
      }

      function renderLastUpdated() {
        document.querySelectorAll("[data-last-updated-at]").forEach((el) => {
          const d = new Date(el.dataset.lastUpdatedAt);
          el.dateTime = d.toISOString();
          el.textContent = formatLastUpdated(d);
          el.title = d.toLocaleString();
        });
      }

      function markRecommendedPlatform() {
        const ua = navigator.userAgent || "";
        const platform = /Android/i.test(ua)
          ? "android"
          : /iPhone|iPad|iPod/i.test(ua) ? "ios" : null;
        if (!platform) return;
        document
          .querySelectorAll(`[data-platform-card="${platform}"]`)
          .forEach((c) => c.classList.add("is-recommended"));
      }

      function applyFilter(q) {
        const term = q.trim().toLowerCase();
        document.querySelectorAll("[data-app]").forEach((panel) => {
          panel.hidden = term !== "" && !panel.dataset.name.includes(term);
        });
      }

      // Per-lane identity. `tab` is unused at render (the toggle markup is
      // static) but documents the canonical label; `env`/`build` drive each
      // app card so a card never mislabels its backend; title/subtitle retag
      // the page header per lane.
      const LANE_META = {
        v3: {
          tab: "v3 (stage)",
          env: "Test",
          build: "New app · internal test backend",
          title: "Bezzy — New app (test)",
          subtitle: "The new Bezzy app on the internal test backend.",
          updated: "2026-06-26T19:20:57Z",
        },
        v2: {
          tab: "v2 (stage)",
          env: "Test",
          build: "Current App Store app · internal test backend",
          title: "Bezzy — Current app (test)",
          subtitle: "The app currently live in the App Store, on the internal test backend.",
          updated: "2026-06-06T15:14:00Z",
        },
        v2prod: {
          tab: "v2 (prod)",
          env: "Live community",
          build: "Current App Store app · connects to your real community",
          title: "Bezzy — Current app (live community)",
          subtitle: "⚠️ The app currently live in the App Store, connected to your real community.",
          updated: "2026-06-18T17:00:00Z",
        },
        prod: {
          tab: "v3 (prod)",
          env: "Live community",
          build: "New app · connects to your real community",
          title: "Bezzy — New app (live community)",
          subtitle: "⚠️ The new app, connected to your real community.",
          updated: "2026-06-23T17:20:00Z",
        },
        search: {
          tab: "Search (Preview)",
          env: "Test",
          build: "Search preview · internal test backend",
          title: "Bezzy — Search preview (test)",
          subtitle: "An early preview of in-app search over posts, members, and articles, on the internal test backend.",
          updated: "2026-07-12T19:47:44Z",
        },
      };

      const LANE_NOTES = {
        v3: "The new app pointed at the internal test backend — safe to post, nothing reaches real members.",
        v2: "The current App Store app pointed at the internal test backend — safe to post, nothing reaches real members. Shares one install slot with the other lanes.",
        prod: "⚠️ This is the new app connected to your REAL community — posts, reactions, and edits are seen by real members. For authorized testing only. All four builds share one install slot, so installing a different one replaces this.",
        v2prod: "⚠️ This is the current App Store app (pre-update) connected to your REAL community — this is what users who haven't updated are running. Posts, reactions, and edits are seen by real members. For authorized testing only. All four builds share one install slot.",
        search: "An early preview of in-app search: search posts, members, and articles from the magnifying glass on the Home screen. Bezzy Depression only, on the internal test backend — safe to post, nothing reaches real members. Shares one install slot with the other lanes.",
      };

      function render() {
        const lane = CURRENT_LANE;
        const meta = LANE_META[lane];
        document.getElementById("page-title").textContent = meta.title;
        document.getElementById("page-subtitle").textContent = meta.subtitle;
        const apps = APPS.filter((a) => a[lane]);
        const list = document.getElementById("app-list");
        list.innerHTML = apps.length
          ? apps.map((a) => appPanel(a, lane)).join("")
          : `<section class="panel"><p class="meta">No ${lane} builds published yet.</p></section>`;
        const missing = APPS.length - apps.length;
        const note = document.getElementById("lane-note");
        note.classList.toggle("is-prod", lane === "prod" || lane === "v2prod");
        note.textContent =
          LANE_NOTES[lane] + (missing > 0 ? ` ${apps.length} of ${APPS.length} apps available.` : "");
        renderLastUpdated();
        markRecommendedPlatform();
        applyFilter(document.getElementById("app-filter").value || "");
      }

      document.querySelectorAll(".lane-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          CURRENT_LANE = btn.dataset.lane;
          document.querySelectorAll(".lane-btn").forEach((b) => {
            const on = b === btn;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-selected", on ? "true" : "false");
          });
          render();
        });
      });

      render();
      window.setInterval(renderLastUpdated, 30 * 1000);
      document
        .getElementById("app-filter")
        .addEventListener("input", (e) => applyFilter(e.target.value));
    </script>
  </body>
</html>
